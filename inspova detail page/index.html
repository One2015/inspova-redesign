// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

  const promptRef = React.useRef(null);
  const [promptOverflow, setPromptOverflow] = React.useState(false);

  React.useEffect(() => {
    if (!promptRef.current) return;
    const el = promptRef.current;
    // measure: compare scrollHeight vs 2 lines
    const lh = parseFloat(getComputedStyle(el).lineHeight) || 21;
    setPromptOverflow(el.scrollHeight > lh * 2 + 2);
  }, []);

  const toggleSave = (id) => {
    setSavedEls(s => ({ ...s, [id]: !s[id] }));
  };

  if (agentMode) {
    return <AgentPanel onExit={onExitAgent} initialPrompt={agentMode.prompt} />;
  }

  return (
    <aside style={{
      width: 520, flexShrink: 0, height: '100vh',
      display: 'flex', flexDirection: 'column',
      background: 'rgba(10,10,12,0.55)',

      borderLeft: '1px solid rgba(255,255,255,0.05)',

      {/* Scroll content */}

        {/* Title */}
        <h1 style={{
          fontSize: 22, fontWeight: 600, margin: '0 0 8px', letterSpacing: '-0.4px', lineHeight: 1.25,
        }}>{HERO.title}</h1>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 28, fontSize: 12, color: 'rgba(255,255,255,0.55)' }}>
          <span>Remixed from</span>
          <span style={{
            padding: '2px 8px', borderRadius: 999, background: 'rgba(255,255,255,0.08)',
            color: 'rgba(255,255,255,0.85)', fontWeight: 500,
          }}>{HERO.remixedFrom}</span>
        </div>

        {/* Elements */}
        <Section title="Elements" hint={`${HERO.elements.length}`}>
          <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>
            {HERO.elements.map(el => (
              <ElementChip key={el.id}
                el={el}
                hovered={hoveredEl === el.id}
                saved={savedEls[el.id]}
                onHover={() => setHoveredEl(el.id)}
                onLeave={() => setHoveredEl(null)}
                onSave={() => toggleSave(el.id)}
                onClick={() => onElementClick(el)}
              />
            ))}
          </div>
        </Section>

        {/* Prompt */}
        <Section title="Prompt">
          <div style={{
            padding: 16, borderRadius: 14,
            background: 'rgba(255,255,255,0.03)',
            border: '1px solid rgba(255,255,255,0.05)',

            <p ref={promptRef} style={{
              margin: 0, fontSize: 14, lineHeight: 1.6, color: 'rgba(255,255,255,0.82)',
              textWrap: 'pretty',
              display: '-webkit-box', WebkitBoxOrient: 'vertical',
              WebkitLineClamp: promptExpanded ? 'unset' : 2,
              overflow: promptExpanded ? 'visible' : 'hidden',
            }}>
              {HERO.prompt}
            </p>
            {promptOverflow && (
              <button onClick={() => setPromptExpanded(e => !e)} style={{
                marginTop: 6, color: 'rgba(255,255,255,0.55)', fontSize: 12, fontWeight: 500,
                display: 'inline-flex', alignItems: 'center', gap: 4,
              }}>
                {promptExpanded ? 'Show less' : 'Show more'}
                <span style={{ display: 'inline-block', transform: promptExpanded ? 'rotate(180deg)' : 'none', transition: 'transform .15s' }}>▾</span>
              </button>
            )}
            <div style={{ display: 'flex', gap: 6, marginTop: 12, flexWrap: 'wrap' }}>
              {HERO.skills.map(s => (
                <span key={s.name} style={{
                  fontSize: 11, padding: '4px 10px', borderRadius: 999,
                  background: s.kind === 'model' ? 'rgba(255,255,255,0.08)' : 'rgba(128,212,255,0.10)',
                  color: s.kind === 'model' ? 'rgba(255,255,255,0.85)' : 'rgb(160,222,255)',

                  fontFamily: s.kind === 'skill' ? 'JetBrains Mono, monospace' : 'inherit',
                  letterSpacing: s.kind === 'skill' ? 0 : 0,
                }}>{s.name}</span>
              ))}
            </div>
          </div>
        </Section>

        {/* Thread — Inspired by this — collapse after 3 */}
        <Section title="Inspired by this" hint={`${THREAD.length}`}>
          <Thread
            items={threadExpanded ? THREAD : THREAD.slice(0, 3)}
            threadStyle={tweaks.threadStyle}
            onRemixOpen={onRemixOpen}
          />

            <button onClick={() => setThreadExpanded(e => !e)} style={{
              marginTop: 4, fontSize: 12, color: 'rgba(255,255,255,0.55)',

              <span style={{ display: 'inline-block', transform: threadExpanded ? 'rotate(180deg)' : 'none', transition: 'transform .15s' }}>▾</span>
            </button>
          )}

      </div>

      <BottomActionBar onRemix={() => onEnterAgent('')} />

  );
}

// Thread component — Threads-style vertical timeline of comments + remixes
function Thread({ items, threadStyle, onRemixOpen }) {
  const [expanded, setExpanded] = React.useState({});

  return (
    <div style={{ position: 'relative' }}>
      {items.map((item, i) => (
        <ThreadItem
          key={item.id} item={item}
          index={i}
          isLast={i === items.length - 1}
          threadStyle={threadStyle}
          expanded={expanded[item.id]}
          onToggle={() => setExpanded(e => ({ ...e, [item.id]: !e[item.id] }))}
          onRemixOpen={onRemixOpen}
        />
      ))}
    </div>
  );
}

function ThreadItem({ item, index, isLast, threadStyle, expanded, onToggle, onRemixOpen }) {
  const compact = threadStyle === 'compact';
  const rich = threadStyle === 'rich';
  const avatarSize = compact ? 26 : 32;
  const lineLeft = compact ? 13 : 16;

  const hasMedia = item.kind === 'remix' && item.media;
  const hasReplies = item.replies && item.replies.length > 0;

  return (
    <div style={{ position: 'relative', display: 'flex', gap: 12, paddingBottom: isLast ? 8 : 18, animation: `fadeIn .3s ${(index || 0) * 0.06}s both` }}>

          border: '1px solid rgba(255,255,255,0.1)',

        {!isLast && (
          <div style={{
            flex: 1, width: 2, marginTop: 6, marginBottom: 6,
            background: 'rgba(255,255,255,0.08)', borderRadius: 2,
          }} />
        )}
        {/* Mini avatar at end of line for last reply (Threads-style stack) */}
        {!isLast && hasReplies && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 2, marginBottom: 4 }}>
            {item.replies.slice(0, Math.min(2, item.replies.length)).map((r, idx) => (

                width: 10, height: 10, borderRadius: 999,
                background: `url(${r.user.avatar}) center/cover, rgba(255,255,255,0.1)`,

        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 3 }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: '#fff' }}>{item.user.name}</span>
          <span style={{ fontSize: 11, color: 'rgba(255,255,255,0.4)' }}>· {item.time}</span>
        </div>

        {/* Text */}
        <p style={{
          margin: 0, fontSize: 14, lineHeight: 1.5, color: 'rgba(255,255,255,0.85)',
          textWrap: 'pretty', marginBottom: hasMedia ? 10 : 8,

        {/* Remix media preview — opens remix history (agent-style chat) */}
        {hasMedia && !compact && (
          <button onClick={() => onRemixOpen && onRemixOpen(item)} style={{
            position: 'relative', display: 'block', marginTop: 4, marginBottom: 8,
            width: rich ? '100%' : 140, maxWidth: 240,
            aspectRatio: rich ? '3/4' : '4/5',
            borderRadius: 12, overflow: 'hidden',
            background: `url(${item.media}) center/cover, rgba(255,255,255,0.04)`,
            border: '1px solid rgba(255,255,255,0.08)',
            cursor: 'pointer',
          }}>
            <div style={{
              position: 'absolute', left: 8, top: 8,
              padding: '3px 7px', borderRadius: 6, fontSize: 10,
              background: 'rgba(0,0,0,0.55)', backdropFilter: 'blur(8px)',
              fontFamily: 'JetBrains Mono', color: '#fff', letterSpacing: 0.3,
            }}>
              <IconRemix size={10} strokeWidth={2} style={{ verticalAlign: -1, marginRight: 4 }} />
              REMIX
            </div>
          </button>
        )}
        {hasMedia && compact && (
          <button onClick={() => onRemixOpen && onRemixOpen(item)} style={{
            display: 'inline-block', marginTop: 4,
            width: 56, height: 70, borderRadius: 8, overflow: 'hidden',
            background: `url(${item.media}) center/cover`,
            border: '1px solid rgba(255,255,255,0.08)',
            cursor: 'pointer',
          }} />
        )}

        {/* Action row */}
        <div style={{ display: 'flex', gap: 18, alignItems: 'center', fontSize: 12, color: 'rgba(255,255,255,0.5)' }}>
          <ThreadAction icon={<IconHeart size={14} />} count={item.stats.likes} likeable />
          {item.kind === 'remix' && <ThreadAction icon={<IconRemix size={14} />} count={item.stats.remixes} />}
          {item.stats.comments != null && <ThreadAction icon={<IconChat size={14} />} count={item.stats.comments} />}
          <ThreadAction icon={<IconShare size={14} />} />
        </div>

        {/* Replies (expandable) */}
        {hasReplies && (
          <button onClick={onToggle} style={{
            marginTop: 10, fontSize: 12, color: 'rgba(255,255,255,0.5)',
            display: 'inline-flex', alignItems: 'center', gap: 6,
          }}>
            <span style={{ width: 18, height: 1, background: 'rgba(255,255,255,0.18)' }} />

          <div style={{ marginTop: 10, display: 'flex', flexDirection: 'column', gap: 10, paddingLeft: 4 }}>

                  background: `url(${r.user.avatar}) center/cover, rgba(255,255,255,0.06)`,
                }} />
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontSize: 12 }}>
                    <span style={{ fontWeight: 600 }}>{r.user.name}</span>
                    <span style={{ color: 'rgba(255,255,255,0.4)', marginLeft: 6 }}>· {r.time}</span>
                  </div>
                  <p style={{ margin: '2px 0 0', fontSize: 12.5, color: 'rgba(255,255,255,0.78)' }}>{r.text}</p>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function ThreadAction({ icon, count, likeable }) {
  const [liked, setLiked] = React.useState(false);
  const [bump, setBump] = React.useState(false);
  const [hover, setHover] = React.useState(false);

  const handleClick = () => {
    if (!likeable) return;
    setLiked(l => !l);
    setBump(true);
    setTimeout(() => setBump(false), 260);
  };

  const displayCount = count != null ? count + (liked ? 1 : 0) : null;

  return (
    <button onClick={handleClick}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        display: 'inline-flex', alignItems: 'center', gap: 5,
        color: liked ? 'rgb(255,85,85)' : hover ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.5)',
        transition: 'color .15s, transform .15s cubic-bezier(0.34,1.56,0.64,1)',
        transform: bump ? 'scale(1.35)' : 'scale(1)',
        fontVariantNumeric: 'tabular-nums', fontSize: 12,
      }}>
      {likeable ? (liked ? <IconHeartFilled size={14} /> : icon) : icon}
      {displayCount != null && <span>{displayCount}</span>}
    </button>
  );
}

// Agent panel — replaces info panel when user enters create/remix mode
function AgentPanel({ onExit, initialPrompt }) {
  const [messages, setMessages] = React.useState(() => {
    const seed = [
      { id: 'm0', role: 'system', text: 'Remixing from "Angel in the elevator portrait"', context: true }
    ];
    if (initialPrompt) {
      seed.push({ id: 'm1', role: 'user', text: initialPrompt });
      seed.push({ id: 'm2', role: 'agent', text: 'Got it — I\'ll remix this with your direction. Holding the original face reference and dress element. Adjusting wing treatment + lighting.', thinking: false });
      seed.push({ id: 'm3', role: 'agent', kind: 'plan', steps: [
        { label: 'Lock face reference', done: true },
        { label: 'Apply style direction', done: true },
        { label: 'Generate variations', done: false, active: true },
      ]});
    }
    return seed;
  });
  const [input, setInput] = React.useState('');
  const [generating, setGenerating] = React.useState(initialPrompt ? true : false);
  const scrollRef = React.useRef(null);

  React.useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  React.useEffect(() => {
    if (generating) {
      const t = setTimeout(() => {
        setMessages(m => [...m, {
          id: 'g' + Date.now(), role: 'agent', kind: 'gen',
          variants: [window.__resources['r_remix_2_png'], window.__resources['r_remix_3_png'], window.__resources['r_remix_4_png']]
        }]);
        setGenerating(false);
      }, 2200);
      return () => clearTimeout(t);
    }
  }, [generating]);

  const send = () => {
    if (!input.trim()) return;
    setMessages(m => [...m, { id: 'u' + Date.now(), role: 'user', text: input }]);
    setInput('');
    setGenerating(true);
    setTimeout(() => {
      setMessages(m => [...m, {
        id: 'a' + Date.now(), role: 'agent',
        text: 'Iterating on that direction now...'
      }]);
    }, 400);
  };

  return (
    <aside style={{
      width: 520, flexShrink: 0, height: '100vh',
      display: 'flex', flexDirection: 'column',
      background: 'rgba(8,10,16,0.7)', backdropFilter: 'blur(40px)',
      borderLeft: '1px solid rgba(128,212,255,0.10)',
      animation: 'slideUp .25s ease',
      position: 'relative', zIndex: 4,
    }}>
      {/* Header */}
      <div style={{
        display: 'flex', alignItems: 'center', gap: 10,
        padding: '16px 16px 14px', borderBottom: '1px solid rgba(255,255,255,0.05)',
      }}>
        <div style={{
          width: 28, height: 28, borderRadius: 8,
          background: 'linear-gradient(135deg, rgb(160,222,255), rgb(120,180,255))',
          display: 'grid', placeItems: 'center', color: '#000',
        }}>
          <IconSparkles size={15} />
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 13, fontWeight: 600 }}>Remix Agent</div>
          <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.5)', display: 'flex', alignItems: 'center', gap: 5 }}>
            {generating ? (
              <>
                <span style={{ width: 6, height: 6, borderRadius: 999, background: 'rgb(160,222,255)', animation: 'pulse 1s infinite' }} />
                Generating...
              </>
            ) : (
              <>
                <span style={{ width: 6, height: 6, borderRadius: 999, background: '#7CFFA1' }} />
                Ready
              </>
            )}
          </div>
        </div>
        <button onClick={onExit} title="Exit agent" style={{
          width: 32, height: 32, borderRadius: 8, display: 'grid', placeItems: 'center',
          color: 'rgba(255,255,255,0.6)', background: 'rgba(255,255,255,0.04)',
        }}>
          <IconClose size={16} />
        </button>
      </div>

      {/* Messages */}
      <div ref={scrollRef} style={{ flex: 1, overflowY: 'auto', padding: '16px', display: 'flex', flexDirection: 'column', gap: 14 }}>
        {messages.map(msg => <Message key={msg.id} msg={msg} />)}
        {generating && <ThinkingBubble />}
      </div>

      {/* Input */}
      <div style={{ padding: '10px 14px 16px', borderTop: '1px solid rgba(255,255,255,0.05)' }}>
        <div style={{
          display: 'flex', alignItems: 'flex-end', gap: 6,
          background: 'rgba(255,255,255,0.04)',
          border: '1px solid rgba(128,212,255,0.18)',
          borderRadius: 16, padding: 6,
        }}>
          <span style={{
            display: 'inline-flex', alignItems: 'center', gap: 4, padding: '6px 10px',

  const [agentMode, setAgentMode] = React.useState(null);
  const [elementPage, setElementPage] = React.useState(null);
  const [remixPage, setRemixPage] = React.useState(null);

  React.useEffect(() => {
    const handler = (e) => setTweaks({ ...e.detail });
    window.addEventListener('tweaks-update', handler);
    return () => window.removeEventListener('tweaks-update', handler);
  }, []);

  return (
    <div style={{ width: '100vw', height: '100vh', display: 'flex', position: 'relative', overflow: 'hidden' }}>
      <AmbientBg src={HERO.src} blur={tweaks.blurDepth} intensity={tweaks.ambientIntensity} />
      <Sidebar />
      <Content tweaks={tweaks} agentMode={agentMode} />
      <InfoPanel
        tweaks={tweaks}
        agentMode={agentMode}
        onEnterAgent={(prompt) => setAgentMode({ prompt })}
        onExitAgent={() => setAgentMode(null)}
        onElementClick={(el) => setElementPage(el)}
        onRemixOpen={(remix) => setRemixPage(remix)}
      />

      {elementPage && <ElementPage el={elementPage} tweaks={tweaks} onClose={() => setElementPage(null)} onRemixOpen={(r) => setRemixPage(r)} />}
      {remixPage && <RemixHistoryPage remix={remixPage} tweaks={tweaks} onClose={() => setRemixPage(null)} />}

      <InspovaTweaks />
    </div>
  );
}

function AmbientBg({ src, blur, intensity }) {
  return (
    <>
      <div style={{
        position: 'absolute', inset: '-10%', zIndex: 0,
        backgroundImage: `url(${src})`, backgroundSize: 'cover', backgroundPosition: 'center',
        filter: `blur(${blur}px) saturate(1.2)`,
        opacity: intensity,
        transform: 'scale(1.2)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, zIndex: 1,
        background: 'radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.85) 90%)',
      }} />
      {/* Grain */}
      <div style={{
        position: 'absolute', inset: 0, zIndex: 2, pointerEvents: 'none', opacity: 0.04,
        backgroundImage: 'url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27200%27 height=%27200%27%3E%3Cfilter id=%27n%27%3E%3CfeTurbulence baseFrequency=%270.9%27/%3E%3C/filter%3E%3Crect width=%27200%27 height=%27200%27 filter=%27url(%23n)%27/%3E%3C/svg%3E")',
      }} />
    </>
  );
}

window.AmbientBg = AmbientBg;
function ElementDetailModal({ el, onClose }) {
  return (
    <div onClick={onClose} style={{
      position: 'fixed', inset: 0, zIndex: 100,
      background: 'rgba(0,0,0,0.7)', backdropFilter: 'blur(20px)',
      display: 'grid', placeItems: 'center', animation: 'fadeIn .2s',
    }}>
      <div onClick={e => e.stopPropagation()} style={{
        width: 480, maxWidth: '90vw', borderRadius: 20,
        background: 'rgba(20,20,24,0.95)', border: '1px solid rgba(255,255,255,0.08)',
        padding: 28, animation: 'slideUp .25s',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 20 }}>
          <div style={{
            width: 96, height: 96, borderRadius: 14, flexShrink: 0,
            background: `url(${el.img}) center/cover, rgba(255,255,255,0.05)`,
            border: '1px solid rgba(255,255,255,0.08)',
          }} />
          <div>
            <div style={{ fontSize: 11, fontFamily: 'JetBrains Mono', color: 'rgba(255,255,255,0.5)', letterSpacing: 0.4, marginBottom: 4 }}>{el.type.toUpperCase()}</div>
            <h2 style={{ margin: 0, fontSize: 22, fontWeight: 600 }}>{el.name}</h2>
            <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.55)', marginTop: 6 }}>Used in 248 remixes · 3 collections</div>
          </div>
        </div>
        <p style={{ fontSize: 13.5, color: 'rgba(255,255,255,0.75)', lineHeight: 1.6, margin: '0 0 20px' }}>
          A reusable element. Drop into the composer to apply to your next remix, or open the full detail page to see other works that built on it.
        </p>
        <div style={{ display: 'flex', gap: 8 }}>
          <button style={{
            flex: 1, padding: '11px 16px', borderRadius: 12, fontSize: 13, fontWeight: 600,
            background: '#fff', color: '#000',
          }}>Use in remix</button>
          <button style={{
            padding: '11px 16px', borderRadius: 12, fontSize: 13, fontWeight: 500,
            background: 'rgba(255,255,255,0.08)', color: '#fff',
            border: '1px solid rgba(255,255,255,0.08)',
          }}>Save to assets</button>
          <button onClick={onClose} style={{
            padding: '11px 14px', borderRadius: 12,
            background: 'rgba(255,255,255,0.04)', color: 'rgba(255,255,255,0.7)',
          }}><IconClose size={16} /></button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);


</script>

</body>
</html>
